name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional full source SHA for rollback; empty builds the current commit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout publication controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve requested source
        id: source
        working-directory: control
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/test-release.py
          target="$INPUT_SHA"
          if [ -z "$target" ] && { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } && git diff --name-only "$BEFORE_SHA" HEAD | grep -qx 'ops/deploy-request.json'; then
            target=$(python3 -c 'import json; print(json.load(open("ops/deploy-request.json")).get("source_sha") or "")')
          fi
          if [ -n "$target" ]; then
            [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full SHA'; exit 1; }
            git cat-file -e "$target^{commit}"
            git merge-base --is-ancestor "$target" HEAD
          else
            target=$(git rev-parse HEAD)
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"
      - name: Checkout website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: site
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
          package_json_file: site/package.json
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Build and validate site
        working-directory: site
        run: |
          node --check public/chat-widget.js
          pnpm build
      - name: Stamp the exact source version
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 control/scripts/prepare-release.py --root site/dist --sha "$SOURCE_SHA" --run-url "$RUN_URL"
      - name: Archive reproducible release
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          tar -czf "site-release-$SOURCE_SHA.tar.gz" -C site/dist .
          sha256sum "site-release-$SOURCE_SHA.tar.gz" > "site-release-$SOURCE_SHA.sha256"
      - name: Keep release archive for recovery
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-release-${{ steps.source.outputs.sha }}
          path: site-release-*
          retention-days: 30
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Checkout verification controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify published domain and exact release
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: python3 scripts/verify-published.py --url https://pchelovod63.ru/ --sha "$SOURCE_SHA"
      - name: Record publication result
        if: always()
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RESULT: ${{ job.status }}
        run: |
          printf '## Publication\n\nSource: `%s`\n\nSite: https://pchelovod63.ru/\n\nVerification: %s\n' "$SOURCE_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
