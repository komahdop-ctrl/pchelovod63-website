name: Verify Opylytel intake (no real personal data)
on:
  push:
    paths:
      - 'opylitel/**'
      - '.github/workflows/verify-opylitel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Validate PHP syntax
        run: |
          php -l opylitel/server/intake.php
          php -l opylitel/server/manage.php
          php -l opylitel/server/preflight.php
          node - <<'JS'
          const fs=require('node:fs'); const html=fs.readFileSync('opylitel/index.html','utf8');const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)]; if(!scripts.length)process.exit(1);for(const match of scripts){new Function(match[1])};console.log('Form JS syntax OK');
          JS
      - name: SQLite / submission / stats / export / deletion smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export OPYLITEL_DB_PATH="$tmp/intake.sqlite"
          export OPYLITEL_HASH_SALT="github-actions-temporary-testing-only-123456"
          export OPYLITEL_ALLOWED_ORIGINS="http://localhost:8765"
          export OPYLITEL_CONSENT_VERSION="ci-consent-v1"
          export OPYLITEL_CONSENT_SHA256="$(printf %s ci-synthetic-consent-v1 | sha256sum | cut -d ' ' -f 1)"
          export OPYLITEL_ACCEPTING="1"
          export OPYLITEL_LEGAL_READY="1"
          export OPYLITEL_SITE_HTTPS_READY="1"
          export OPYLITEL_WEB_ROOT="$PWD/opylitel/server"
          php opylitel/server/preflight.php | jq -e '.status == "ready"'
          php opylitel/server/manage.php init
          OPYLITEL_LEGAL_READY=0 php -S 127.0.0.1:8765 -t opylitel/server > "$tmp/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          sleep 2
          legal_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://localhost:8765' -H 'Content-Type: application/json' --data '{}' http://localhost:8765/intake.php)"
          test "$legal_code" = "503"
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          php -S 127.0.0.1:8765 -t opylitel/server >> "$tmp/server.log" 2>&1 &
          pid=$!
          sleep 2
          payload='{"fullName":"Test User","phone":"+79991234567","region":"Самарская область","locality":"Самара","availableFamilies":10,"totalFamilies":12,"maxDistance":"50","longTrip":"yes","priceMode":"quote","desiredPriceRub":5000,"minAcceptableRub":4000,"farPriceRub":6500,"advancePercent":"50","paymentChannel":"bank_account","finalPayment":"on_completion","minLot":5,"months":["06"],"crops":"","comments":"","consent":true,"season":2027,"schemaVersion":3,"consentVersion":"ci-consent-v1","website":""}'
          code="$(curl -sS -o "$tmp/response.json" -w '%{http_code}' -X POST -H 'Origin: http://localhost:8765' -H 'Content-Type: application/json' --data "$payload" http://localhost:8765/intake.php)"
          test "$code" = "201"
          jq -e '.ok == true and (.requestId | startswith("B27-"))' "$tmp/response.json"
          request_code="$(jq -r '.requestId' "$tmp/response.json")"
          php -r '$db=new PDO("sqlite:".getenv("OPYLITEL_DB_PATH"));$r=$db->query("SELECT consent_version,consent_sha256,consent_recorded_at FROM requests LIMIT 1")->fetch(PDO::FETCH_ASSOC);if($r["consent_version"]!=="ci-consent-v1"||$r["consent_sha256"]!==getenv("OPYLITEL_CONSENT_SHA256")||!$r["consent_recorded_at"])exit(1);'
          php opylitel/server/manage.php stats | jq -e '.applications == 1 and .families_offered == 10'
          php -r '$db=new PDO("sqlite:".getenv("OPYLITEL_DB_PATH"));$r=$db->query("SELECT desired_price_rub,min_acceptable_rub,far_price_rub,long_trip,advance_percent,transport_payment,telegram,extra_transport_rub FROM requests LIMIT 1")->fetch(PDO::FETCH_ASSOC);fwrite(STDOUT,json_encode($r)."\\n");if((int)$r["desired_price_rub"]!==5000||(int)$r["min_acceptable_rub"]!==4000||(int)$r["far_price_rub"]!==6500||$r["long_trip"]!=="yes"||$r["advance_percent"]!=="50"||$r["transport_payment"]!=="included"||$r["telegram"]!==""||$r["extra_transport_rub"]!==null)exit(1);'
          no_consent="$(printf '%s' "$payload" | jq -c '.consent = false')"
          reject_consent="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://localhost:8765' -H 'Content-Type: application/json' --data "$no_consent" http://localhost:8765/intake.php)"
          test "$reject_consent" = "422"
          old_consent="$(printf '%s' "$payload" | jq -c '.consentVersion = "outdated"')"
          reject_version="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://localhost:8765' -H 'Content-Type: application/json' --data "$old_consent" http://localhost:8765/intake.php)"
          test "$reject_version" = "422"
          wrong_price="$(printf '%s' "$payload" | jq -c '.desiredPriceRub = 0')"
          invalid_financial="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://localhost:8765' -H 'Content-Type: application/json' --data "$wrong_price" http://localhost:8765/intake.php)"
          echo "Invalid financial status: $invalid_financial"
          test "$invalid_financial" = "422"
          obsolete="$(printf '%s' "$payload" | jq -c '.telegram = "@extra"')"
          obsolete_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://localhost:8765' -H 'Content-Type: application/json' --data "$obsolete" http://localhost:8765/intake.php)"
          test "$obsolete_code" = "422"
          php opylitel/server/manage.php public-stats | jq -e '.status == "insufficient_data" and .applications == null'
          php opylitel/server/manage.php export "$tmp/secret-export.csv"
          test -s "$tmp/secret-export.csv"
          test "$(stat -c '%a' "$tmp/secret-export.csv")" = "600"
          denied="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' --data "$payload" http://localhost:8765/intake.php)"
          test "$denied" = "403"
          invalid="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://localhost:8765' -H 'Content-Type: application/json' --data '{"fullName":"bad"}' http://localhost:8765/intake.php)"
          test "$invalid" = "422"
          php opylitel/server/manage.php delete "$request_code"
          php opylitel/server/manage.php stats | jq -e '.applications == 0'
