<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">Густой сироп: две части сахара и одна часть воды по массе</title><desc id="d">2 килограмма сахара плюс 1 килограмм воды дают 3 килограмма сиропа с массовой долей сахара 66,7 процента. Это не три литра.</desc><rect width="1000" height="350" rx="22" fill="#fff7e5"/><g font-family="Arial,sans-serif" fill="#214432" text-anchor="middle"><text x="500" y="55" font-size="27" font-weight="bold">2 : 1 — ПО МАССЕ</text><rect x="60" y="100" width="230" height="145" rx="18" fill="#f4d388"/><text x="175" y="155" font-size="34" font-weight="bold">2 кг</text><text x="175" y="198" font-size="24">белого сахара</text><text x="330" y="180" font-size="42">+</text><rect x="375" y="100" width="230" height="145" rx="18" fill="#deedea"/><text x="490" y="155" font-size="34" font-weight="bold">1 кг</text><text x="490" y="198" font-size="24">чистой воды</text><text x="650" y="180" font-size="42">=</text><rect x="695" y="100" width="250" height="145" rx="18" fill="#264f3e"/><g fill="white"><text x="820" y="155" font-size="34" font-weight="bold">3 кг сиропа</text><text x="820" y="198" font-size="24">66,7% сахара</text></g><text x="500" y="301" font-size="22">Масса сиропа ≠ его объём ≠ масса запасённого корма</text></g></svg>