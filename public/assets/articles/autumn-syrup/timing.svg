<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Как выбрать момент подкормки</title><desc id="d">После медосбора оценить запасы и здоровье. Пока тепло дать необходимый корм. До холодов проверить размещение и переработку. В холод контролировать доступность запасов; при голоде использовать подходящий твёрдый корм.</desc><rect width="1000" height="440" rx="22" fill="#edf1e7"/><g font-family="Arial,sans-serif" fill="#214432"><text x="42" y="60" font-size="28" font-weight="bold">Ориентир — состояние семьи и погода</text><path d="M80 145H920" stroke="#be9341" stroke-width="5"/><g fill="#d6ab54"><circle cx="80" cy="145" r="14"/><circle cx="360" cy="145" r="14"/><circle cx="640" cy="145" r="14"/><circle cx="920" cy="145" r="14"/></g><g font-size="21" font-weight="bold"><text x="42" y="210">После взятка</text><text x="290" y="210">Пока тепло</text><text x="550" y="210">До холодов</text><text x="805" y="210">В холод</text></g><g font-size="18"><text x="42" y="250">Учесть запасы,</text><text x="42" y="280">силу и здоровье</text><text x="290" y="250">Восполнить</text><text x="290" y="280">нужный дефицит</text><text x="550" y="250">Проверить корм</text><text x="550" y="280">и его доступность</text><text x="795" y="250">Контролировать</text><text x="795" y="280">запасы у клуба</text></g><text x="42" y="373" font-size="21">Чужая календарная дата не заменяет оценку своей пасеки.</text></g></svg>