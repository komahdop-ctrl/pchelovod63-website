<g font-family="Arial,sans-serif" font-size="22" fill="#244e4c"><text x="805" y="205">Тёплый верх:</text><text x="805" y="238">меньше риска капель</text><text x="805" y="271">над клубом</text><text x="805" y="375">Клуб выделяет</text><text x="805" y="408">тепло и водяной пар</text><text x="805" y="500">Холоднее у стенок:</text><text x="805" y="533">возможен конденсат</text><text x="55" y="640">Капли на стенке и вода, падающая на пчёл, — разные ситуации.</text></g></svg>