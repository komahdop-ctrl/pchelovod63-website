<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#eaf4f8"/><g font-family="Arial,sans-serif" fill="#244e4c"><text x="50" y="65" font-size="32" font-weight="bold">Две схемы: нельзя смешивать наугад</text><text x="50" y="108" font-size="22">Принципиальные варианты, без размеров и норм открытия.</text></g><rect x="65" y="145" width="495" height="490" rx="20" fill="#fffdf7"/><text x="87" y="190" font-family="Arial,sans-serif" font-size="25" fill="#244e4c">Нижний воздухообмен</text><rect x="145" y="250" width="320" height="230" fill="#d1ded0" stroke="#345a53" stroke-width="12"/><ellipse cx="305" cy="370" rx="95" ry="65" fill="#d6a03f"/><rect x="640" y="145" width="495" height="490" rx="20" fill="#fffdf7"/><text x="662" y="190" font-family="Arial,sans-serif" font-size="25" fill="#244e4c">Верхний выход воздуха</text><rect x="720" y="250" width="320" height="230" fill="#d1ded0" stroke="#345a53" stroke-width="12"/><ellipse cx="880" cy="370" rx="95" ry="65" fill="#d6a03f"/><path d="M145 237H465" stroke="#e6b65a" stroke-width="27"/><path d="M145 480H465" stroke="#6b9eb9" stroke-width="13" stroke-dasharray="8 8"/><path d="M225 535V480M385 480V535" stroke="#5998b6" stroke-width="7"/><path d="M720 237H1020M720 480H1040" stroke="#e6b65a" stroke-width="18"/><path d="M1030 345V218" stroke="#5998b6" stroke-width="7"/><path d="M1017 235L1030 214L1043 235" fill="none" stroke="#5998b6" stroke-width="7"/><g font-family="Arial,sans-serif" font-size="21" fill="#244e4c"><text x="90" y="570">Утеплённый сплошной верх.</text><text x="90" y="605">Рабочие нижние пути воздухообмена.</text><text x="665" y="570">Предусмотренный верхний выход.</text><text x="665" y="605">Приток снизу без сквозняка.</text><text x="50" y="678">Выбор зависит от конструкции, силы семьи, ветра и места зимовки.</text></g></svg>