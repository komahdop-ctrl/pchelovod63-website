овье семьи</text><text x="700" y="473" font-size="25">по-прежнему важны.</text></g><text x="55" y="680" font-family="Arial,sans-serif" font-size="18" fill="#536d66">ПЧЕЛОВОД 63 · авторская иллюстрация, не кадр из видео</text></svg>