<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Климат оценивают по возможности облёта</title><desc id="d">Долгая безоблётность повышает требования к качеству корма. Облёты уменьшают часть рисков, но тепло без лётной погоды этого не гарантирует.</desc><rect width="1100" height="620" rx="20" fill="#1b4235"/><g font-family="Arial,sans-serif"><text x="50" y="65" font-family="Georgia,serif" font-size="32" fill="#fff3d7">Смотреть на облёты, а не только на градусы</text><text x="50" y="105" font-size="17" fill="#d2dfcc">Климат меняет ограничения — но не качество самого корма</text><g><rect x="45" y="150" width="320" height="315" rx="15" fill="#f2f3e9"/><rect x="390" y="150" width="320" height="315" rx="15" fill="#f8eed4"/><rect x="735" y="150" width="320" height="315" rx="15" fill="#eee8dc"/></g><g stroke="#547b83" stroke-width="3"><path d="M98 190v50m-22-38 44 25m0-25-44 25"/><path d="M443 204h32m-16-16v32" stroke="#c0903c"/><circle cx="459" cy="204" r="25" fill="none" stroke="#c0903c"/><path d="M789 199c-5-20 24-29 34-9 23-6 33 24 10 28h-41c-19 0-20-19-3-19Z" fill="#a5b8b4" stroke="none"/><path d="m794 230-4 12m19-12-4 12m19-12-4 12"/></g><g fill="#254c3c" font-size="22" font-weight="bold"><text x="70" y="285">Долгая безоблётность</text><text x="415" y="285">Реальные облёты</text><text x="760" y="285">Тепло, но нелётно</text></g><g font-size="18" fill="#526455"><text x="70" y="330">Особенно строгий выбор</text><text x="70" y="361">сомнительных запасов.</text><text x="70" y="407">Зимовник не отменяет</text><text x="70" y="435">удержания каловых масс.</text><text x="415" y="330">Меньше ограничений</text><text x="415" y="361">по очистке кишечника.</text><text x="415" y="407">Плотный или плохой корм</text><text x="415" y="435">всё равно остаётся риском.</text><text x="760" y="330">Не равно возможности</text><text x="760" y="361">освободить кишечник.</text><text x="760" y="407">Активность и расплод</text><text x="760" y="435">могут увеличить расход.</text></g><text x="50" y="528" font-size="20" fill="#ffe2a0">Во всех сценариях: доступный корм + достаточный запас + здоровая семья.</text><text x="50" y="574" font-size="14" fill="#bbd0bc">Схема условий · Не карта регионов и не численный прогноз зимних потерь</text></g></svg>
