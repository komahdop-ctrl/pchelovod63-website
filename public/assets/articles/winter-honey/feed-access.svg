<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">Мёд есть — но доступен ли он клубу?</title><desc id="d">Три условных вида сота: запас рядом с клубом, запас через холодный разрыв и плотная кристаллизация. Рисунок не задаёт точные размеры и температуры.</desc><defs><pattern id="h" width="36" height="42" patternUnits="userSpaceOnUse"><path d="M18 1 35 11 35 31 18 41 1 31 1 11Z" fill="none" stroke="#a97831" stroke-width="1.1"/></pattern><pattern id="c" width="22" height="22" patternUnits="userSpaceOnUse"><path d="m3 3 7 2-2 8-6-1Z M15 13l6 2-4 6-5-3Z" fill="#fff4d4" stroke="#d5bb7e"/></pattern></defs><rect width="1100" height="650" rx="20" fill="#f6f1e5"/><text x="48" y="65" font-family="Georgia,serif" font-size="32" fill="#244435">Мёд есть. Но доступен ли он?</text><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#5b6e60">Три разных ситуации — и разные причины риска</text><g font-family="Arial,sans-serif"><rect x="40" y="140" width="320" height="370" rx="16" fill="#fffdf6"/><rect x="390" y="140" width="320" height="370" rx="16" fill="#fffdf6"/><rect x="740" y="140" width="320" height="370" rx="16" fill="#fffdf6"/><g stroke="#8b6e3c" stroke-width="6"><rect x="70" y="175" width="260" height="220" rx="4" fill="#e9bd60"/><rect x="420" y="175" width="260" height="220" rx="4" fill="#e9bd60"/><rect x="770" y="175" width="260" height="220" rx="4" fill="#e9bd60"/></g><rect x="75" y="180" width="250" height="210" fill="url(#h)"/><rect x="425" y="180" width="250" height="210" fill="url(#h)"/><rect x="775" y="180" width="250" height="210" fill="url(#c)"/><path d="M428 270H672V318H428Z" fill="#d5e6e8" opacity=".95"/><ellipse cx="198" cy="341" rx="71" ry="47" fill="#25483b"/><ellipse cx="548" cy="351" rx="71" ry="35" fill="#25483b"/><ellipse cx="898" cy="341" rx="71" ry="47" fill="#25483b"/><g fill="#e9c075" font-size="14"><text x="178" y="346">клуб</text><text x="528" y="356">клуб</text><text x="878" y="346">клуб</text></g><path d="M198 280v-49m0 0-9 14m9-14 9 14" stroke="#3d7250" stroke-width="5" fill="none"/><path d="m538 282 20 20m0-20-20 20" stroke="#af6657" stroke-width="4"/><text x="80" y="438" font-size="20" font-weight="bold" fill="#2f6046">Корм рядом</text><text x="80" y="468" font-size="16" fill="#536858">Непрерывный доступ</text><text x="430" y="438" font-size="20" font-weight="bold" fill="#855a31">Холодный разрыв</text><text x="430" y="468" font-size="16" fill="#536858">Трудно перейти к запасу</text><text x="780" y="438" font-size="20" font-weight="bold" fill="#965f42">Плотная садка</text><text x="780" y="468" font-size="16" fill="#536858">Трудно использовать корм</text><text x="48" y="563" font-size="19" fill="#244435">Вес улья показывает запас, но не гарантирует его доступность.</text><text x="48" y="600" font-size="14" fill="#68766b">Условная схема · ПЧЕЛОВОД 63 · Не модель точных размеров клуба и температур</text></g></svg>
